# One entry per carousel. The pipeline takes the first story with status: todo
# (or the one named with --story <id>).
#
# Give EITHER:
#   idea:   your real moment, 2-5 lines in your own words. Gemini expands it into
#           slides (you can then paste the drafted slides back here and edit them), OR
#   slides: the full text yourself. One list item per slide. Use a blank line
#           (\n\n) inside an item for a paragraph break.
#
# Write about things that really happened to you. First-person stories about
# invented events read as generic and are not honest to your audience.
stories:
  - id: sample-comparison
    status: todo
    title: "Moving Homes Is Bigger for Him Than for Us"
    hook: "We moved to a new home recently. He is still adjusting."
    illustration: "a small boy standing at the doorway of a new home, looking back at a park with a swing, soft evening light"
    idea: >
      Recently we moved to our new home. our child Pragyan was very fond of her babysitter and the society park. the new park is not at par with the old one and shifting means too much change for him in terms of environment and the babysitter. he still remembers her old babysitter and asks about her. this is tough for us but thinking from his perspective, the changes which we see very small are actually very big for him.
    slides: []
    caption: ""
    hashtags: "#parenting #fatherhood #parentingreflections #indianparents"

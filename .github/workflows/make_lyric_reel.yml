name: make-lyric-reel

on:
  workflow_dispatch:            # tap "Run workflow" in the GitHub mobile app
    inputs:
      song:
        description: "Song id from songs.yaml (blank = next todo)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run with audio files in a PUBLIC repo
        if: github.event.repository.private == false
        run: |
          if find songs -type f \( -name '*.mp3' -o -name '*.m4a' -o -name '*.wav' -o -name '*.flac' \) | grep -q .; then
            echo "::error::songs/ contains audio but this repository is public. Make it private first (Settings > Danger zone > Change visibility)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core
      - run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}

      - name: Build lyric reel
        run: python main.py ${{ inputs.song && format('--song {0}', inputs.song) || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels
          path: output/
          retention-days: 7
